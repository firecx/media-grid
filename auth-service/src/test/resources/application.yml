# Тесты не обращаются к центру конфигурации и регистру служб, а читают те же файлы
# из каталога config/ напрямую. Подключение к базе подставляет Testcontainers.
spring:
  application:
    name: auth-service
  config:
    import:
      - file:../config/application.yml
      - file:../config/auth-service.yml
