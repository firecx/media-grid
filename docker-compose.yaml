name: mediagrid

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  discovery:
    build:
      context: .                          # корень репозитория: нужен модуль common
      dockerfile: discovery/Dockerfile
    image: mediagrid/discovery:${MEDIAGRID_VERSION:-0.7.0}
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-server:
    build:
      context: .                          # корень репозитория: нужен модуль common
      dockerfile: config-server/Dockerfile
    image: mediagrid/config-server:${MEDIAGRID_VERSION:-0.7.0}
    restart: unless-stopped
    environment:
      EUREKA_URL: http://discovery:8761/eureka
      CONFIG_LOCATION: file:/config/
    volumes:
      - ./config:/config:ro
    ports:
      - "8888:8888"
    depends_on:
      discovery: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    build:
      context: .                          # корень репозитория: нужен модуль common
      dockerfile: gateway/Dockerfile
    image: mediagrid/gateway:${MEDIAGRID_VERSION:-0.7.0}
    restart: unless-stopped
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://discovery:8761/eureka
    ports:
      - "8080:8080"                       # служебный порт 8081 наружу не публикуется
    depends_on:
      config-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-service:
    build:
      context: .                          # корень репозитория: нужен модуль common
      dockerfile: auth-service/Dockerfile
    image: mediagrid/auth-service:${MEDIAGRID_VERSION:-0.7.0}
    restart: unless-stopped
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://discovery:8761/eureka
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Секреты служб, которым выдаётся токен службы
      PROCESSING_CLIENT_SECRET: ${PROCESSING_CLIENT_SECRET}
    # Порт наружу не публикуется: запросы приходят только через шлюз
    depends_on:
      postgres: { condition: service_healthy }
      config-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8100/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  media-service:
    build:
      context: .                          # корень репозитория: нужен модуль common
      dockerfile: media-service/Dockerfile
    image: mediagrid/media-service:${MEDIAGRID_VERSION:-0.7.0}
    restart: unless-stopped
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://discovery:8761/eureka
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    # Порт наружу не публикуется: запросы приходят только через шлюз
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8200/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  storage-service:
    build:
      context: .                          # корень репозитория: нужен модуль common
      dockerfile: storage-service/Dockerfile
    image: mediagrid/storage-service:${MEDIAGRID_VERSION:-0.7.0}
    restart: unless-stopped
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://discovery:8761/eureka
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      STORAGE_ROOT: /data/storage
      STORAGE_LINK_SECRET: ${STORAGE_LINK_SECRET}
    volumes:
      # Файлы пользователей; наружу каталог не публикуется, файлы отдаёт только служба
      - storage-data:/data/storage
    # Порт наружу не публикуется: запросы приходят только через шлюз
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8300/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  processing-service:
    build:
      context: .                          # корень репозитория: нужен модуль common
      dockerfile: processing-service/Dockerfile
    image: mediagrid/processing-service:${MEDIAGRID_VERSION:-0.7.0}
    restart: unless-stopped
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://discovery:8761/eureka
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      PROCESSING_WORK_DIR: /data/processing
      PROCESSING_CLIENT_SECRET: ${PROCESSING_CLIENT_SECRET}
    volumes:
      # Временные файлы обработки (исходник и результаты на время задачи); очищается при запуске
      - processing-work:/data/processing
    # Порт наружу не публикуется: ход обработки запрашивается только через шлюз.
    # Остановка службы не мешает загрузке и просмотру (ТЗ, п. 4.1.4): задачи ждут в очереди
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8400/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Службы добавляются сюда по мере готовности, по образцу auth-service.

volumes:
  postgres-data:
  storage-data:
  processing-work:
