name: mediagrid

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  discovery:
    build:
      context: .                          # корень репозитория: нужен модуль common
      dockerfile: discovery/Dockerfile
    image: mediagrid/discovery:${MEDIAGRID_VERSION:-0.2.0}
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-server:
    build:
      context: .                          # корень репозитория: нужен модуль common
      dockerfile: config-server/Dockerfile
    image: mediagrid/config-server:${MEDIAGRID_VERSION:-0.2.0}
    restart: unless-stopped
    environment:
      EUREKA_URL: http://discovery:8761/eureka
      CONFIG_LOCATION: file:/config/
    volumes:
      - ./config:/config:ro
    ports:
      - "8888:8888"
    depends_on:
      discovery: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Службы добавляются сюда по мере готовности. Образец:
  # auth-service:
  #   build:
  #     context: .                          # корень репозитория: нужен модуль common
  #     dockerfile: auth-service/Dockerfile
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     rabbitmq: { condition: service_healthy }

volumes:
  postgres-data:
