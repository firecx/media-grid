name: mediagrid

# Журналы контейнеров: не больше 3 файлов по 10 МБ на контейнер (иначе журналы рано или поздно заполнят
# диск сервера); tag — имя контейнера в каждой записи, по нему сборщик журналов различает службы
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

# У каждой службы stop_grace_period: сколько ждать штатной остановки, прежде чем убить контейнер.
# Без него Docker 29 при docker stop / docker compose stop убивает контейнер примерно через 3,5 с (код 137),
# а службе на Java нужно ~4 с: в конце она снимается с регистрации в регистре служб. Убитая раньше
# служба числится в регистре ещё до 90 с, и шлюз шлёт запросы в пустоту; задачи обработки не
# возвращаются в очередь сразу, а ждут проверки зависших.

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Порт наружу не публикуется; для отладки — docker-compose.debug.yaml
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    # Порты наружу не публикуются; панель управления для отладки — docker-compose.debug.yaml
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  discovery:
    build:
      context: .                          # корень репозитория: нужен модуль common
      dockerfile: discovery/Dockerfile
    image: mediagrid/discovery:${MEDIAGRID_VERSION:-0.11.0}
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    # Порт наружу не публикуется; панель регистра для отладки — docker-compose.debug.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-server:
    build:
      context: .                          # корень репозитория: нужен модуль common
      dockerfile: config-server/Dockerfile
    image: mediagrid/config-server:${MEDIAGRID_VERSION:-0.11.0}
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    environment:
      EUREKA_URL: http://discovery:8761/eureka
      CONFIG_LOCATION: file:/config/
    volumes:
      - ./config:/config:ro
    # Порт наружу не публикуется: настройки нужны только службам; для отладки — docker-compose.debug.yaml
    depends_on:
      discovery: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    build:
      context: .                          # корень репозитория: нужен модуль common
      dockerfile: gateway/Dockerfile
    image: mediagrid/gateway:${MEDIAGRID_VERSION:-0.11.0}
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://discovery:8761/eureka
    # Наружу не публикуется: браузер обращается к web (nginx), тот передаёт /api шлюзу
    depends_on:
      config-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-service:
    build:
      context: .                          # корень репозитория: нужен модуль common
      dockerfile: auth-service/Dockerfile
    image: mediagrid/auth-service:${MEDIAGRID_VERSION:-0.11.0}
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://discovery:8761/eureka
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Секреты служб, которым выдаётся токен службы
      PROCESSING_CLIENT_SECRET: ${PROCESSING_CLIENT_SECRET}
    # Порт наружу не публикуется: запросы приходят только через шлюз
    depends_on:
      postgres: { condition: service_healthy }
      config-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8100/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  media-service:
    build:
      context: .                          # корень репозитория: нужен модуль common
      dockerfile: media-service/Dockerfile
    image: mediagrid/media-service:${MEDIAGRID_VERSION:-0.11.0}
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://discovery:8761/eureka
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    # Порт наружу не публикуется: запросы приходят только через шлюз
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8200/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  storage-service:
    build:
      context: .                          # корень репозитория: нужен модуль common
      dockerfile: storage-service/Dockerfile
    image: mediagrid/storage-service:${MEDIAGRID_VERSION:-0.11.0}
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://discovery:8761/eureka
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      STORAGE_ROOT: /data/storage
      STORAGE_LINK_SECRET: ${STORAGE_LINK_SECRET}
    volumes:
      # Файлы пользователей; наружу каталог не публикуется, файлы отдаёт только служба
      - storage-data:/data/storage
    # Порт наружу не публикуется: запросы приходят только через шлюз
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8300/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  processing-service:
    build:
      context: .                          # корень репозитория: нужен модуль common
      dockerfile: processing-service/Dockerfile
    image: mediagrid/processing-service:${MEDIAGRID_VERSION:-0.11.0}
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://discovery:8761/eureka
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      PROCESSING_WORK_DIR: /data/processing
      PROCESSING_CLIENT_SECRET: ${PROCESSING_CLIENT_SECRET}
    volumes:
      # Временные файлы обработки (исходник и результаты на время задачи); очищается при запуске
      - processing-work:/data/processing
    # Порт наружу не публикуется: ход обработки запрашивается только через шлюз.
    # Остановка службы не мешает загрузке и просмотру (ТЗ, п. 4.1.4): задачи ждут в очереди
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8400/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: ./web                      # интерфейсу не нужны модули Maven
    image: mediagrid/web:${MEDIAGRID_VERSION:-0.11.0}
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    environment:
      GATEWAY_ADDRESS: gateway:8080
      # auto — HTTPS (сертификат из certs/ или самоподписанный), off — только HTTP (разработка)
      MEDIAGRID_TLS: ${MEDIAGRID_TLS:-auto}
      # Имя сервера для самоподписанного сертификата
      MEDIAGRID_HOSTNAME: ${MEDIAGRID_HOSTNAME:-localhost}
      # Порт HTTPS снаружи — для перенаправления с HTTP
      MEDIAGRID_HTTPS_PORT: ${MEDIAGRID_HTTPS_PORT:-443}
      # Файлы сертификата и ключа внутри каталога сертификатов (по умолчанию fullchain.pem, privkey.pem)
      MEDIAGRID_TLS_CERT_FILE: ${MEDIAGRID_TLS_CERT_FILE:-}
      MEDIAGRID_TLS_KEY_FILE: ${MEDIAGRID_TLS_KEY_FILE:-}
    ports:
      # Единственные порты системы, открытые наружу: интерфейс и /api. С 80 — перенаправление на HTTPS
      - "${MEDIAGRID_HTTP_PORT:-80}:80"
      - "${MEDIAGRID_HTTPS_PORT:-443}:443"
    volumes:
      # Сертификат и ключ; если их нет, при запуске создаётся самоподписанный
      - ${MEDIAGRID_CERTS_DIR:-./certs}:/etc/nginx/certs
      # Каталог проверки для Let's Encrypt (certbot certonly --webroot -w <этот каталог>)
      - ${MEDIAGRID_ACME_DIR:-./certs/acme}:/var/www/acme:ro
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Резервное копирование (ТЗ, пп. 4.1.4, 7): по расписанию база и файловое хранилище одним снимком
  # restic — только изменившееся, с шифрованием; хранятся 7 ежедневных, 4 еженедельных, 6 ежемесячных.
  # Копия вручную: docker compose exec backup mediagrid-backup; снимки: docker compose exec backup
  # restic snapshots; восстановление — README, «Резервное копирование»
  backup:
    build:
      context: ./infra/backup
    image: mediagrid/backup:${MEDIAGRID_VERSION:-0.11.0}
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    # crond не обрабатывает сигнал остановки сам; init передаёт его и забирает завершённые процессы
    init: true
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Пароль шифрования копий. Без него копии не прочитать — храните его копию отдельно от сервера
      RESTIC_PASSWORD: ${BACKUP_PASSWORD:?Задайте BACKUP_PASSWORD в .env — пароль резервных копий}
      # Куда класть копии: по умолчанию папка BACKUP_DIR (том /repo); другой сервер или объектное
      # хранилище — адрес restic, например sftp:user@host:/srv/mediagrid или s3:https://host/bucket
      RESTIC_REPOSITORY: ${BACKUP_REPOSITORY:-/repo}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      # Расписание в формате cron и часовой пояс: по умолчанию каждый день в 03:00 по Москве
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      TZ: ${BACKUP_TZ:-Europe/Moscow}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
    volumes:
      # Файлы пользователей (запись нужна только при восстановлении)
      - storage-data:/data/storage
      # Хранилище копий. Лучше на другом диске: копия на том же диске не спасёт при его поломке
      - ${BACKUP_DIR:-./backups}:/repo
      # Когда была последняя удачная и неудачная копия — для проверки готовности
      - backup-state:/var/lib/mediagrid-backup
    depends_on:
      postgres: { condition: service_healthy }
    # «Нездорова», если последняя копия не удалась или удачной нет дольше суток
    healthcheck:
      test: ["CMD", "mediagrid-backup-health"]
      interval: 5m
      timeout: 10s
      start_period: 30s

  # Службы добавляются сюда по мере готовности, по образцу auth-service.

volumes:
  postgres-data:
  storage-data:
  processing-work:
  backup-state:
