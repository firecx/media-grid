# Настройки шлюза. Маршруты меняются здесь, без пересборки образа
# (после правки шлюз нужно перезапустить).
#
# Соглашение: снаружи все запросы идут на /api/<раздел>/**, путь передаётся
# службе без изменений. lb://<имя> — служба ищется в регистре служб,
# запросы распределяются между её экземплярами.

spring:
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # Остановленная служба может ещё числиться в регистре: её адрес в сети Docker исчезает, и
            # соединение не отклоняется, а ждёт. Внутри сети соединение устанавливается за доли
            # миллисекунды, поэтому 500 мс — с большим запасом; с повторами чтения худший случай ~1,8 с.
            # Время ответа не ограничивается — файлы передаются долго
            connect-timeout: 500
          # Устойчивость (ТЗ, п. 4.1.1), для каждого маршрута отдельно:
          # - CircuitBreaker: размыкатель с именем маршрута (auth, media, files, processing). Сбой — только
          #   когда до службы не достучаться (отказ или обрыв соединения, нет экземпляров в регистре).
          #   Ответы служб, в том числе 5xx, сбоем не считаются: служба жива и отвечает (а её 503 может
          #   означать недоступность другой службы). Пока цепь разомкнута — сразу 503 с Retry-After.
          # - Retry: повтор только чтения (GET, HEAD) — при отказе соединения и ответах 502/503/504,
          #   2 раза с паузой 100 и 200 мс; каждый повтор балансировщик может отправить на другой экземпляр.
          #   Запись не повторяется: тело загрузки идёт потоком и второй раз его не отправить. Повтор
          #   возможен, только пока ответ не начал передаваться; оборванное скачивание браузер докачает сам.
          #   Ответ 500 не повторяется — это ошибка обработки, повтор даст то же.
          # Размыкатель снаружи повторов: серия повторов считается одним обращением.
          default-filters:
            - name: CircuitBreaker
            - name: Retry
              args:
                retries: 2
                methods: GET,HEAD
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                series: ""
                backoff:
                  first-backoff: 100ms
                  max-backoff: 200ms
                  factor: 2
                  based-on-previous-value: false
          routes:
            - id: auth
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
            - id: media
              uri: lb://media-service
              predicates:
                - Path=/api/media/**
            - id: files
              uri: lb://storage-service
              predicates:
                - Path=/api/files/**
            - id: processing
              uri: lb://processing-service
              predicates:
                - Path=/api/processing/**

    circuitbreaker:
      resilience4j:
        # Без ограничения времени: загрузка и просмотр файлов идут минутами и часами. От зависших
        # служб защищают тайм-ауты внутри служб и тайм-аут соединения выше
        disable-time-limiter: true

# Размыкатель: разомкнуть, если из последних 20 обращений к службе (не меньше 10) половина — сбой;
# через 10 секунд пропустить 3 пробных запроса (пауза короткая: если служба поднялась, но шлюз ещё не
# увидел её в регистре, пробные запросы не пройдут, и цепь разомкнётся снова — лишние 10, а не 30 с).
# Значение wait-duration-in-open-state шлюз
# сообщает клиенту в заголовке Retry-After
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

mediagrid:
  gateway:
    revocations:
      # Шлюз входит в службу авторизации как служба (имя gateway) и раз в poll-interval забирает список
      # отозванных токенов доступа: выход, смена пароля, отключение, смена роли. Это и есть задержка отзыва
      client-secret: ${GATEWAY_CLIENT_SECRET:}
      poll-interval: 5s

management:
  endpoints:
    web:
      exposure:
        # gateway — список маршрутов (/actuator/gateway/routes), только на служебном порту
        include: health,info,gateway
  endpoint:
    gateway:
      # По умолчанию закрыта; только чтение — менять маршруты через неё нельзя
      access: read-only

logging:
  level:
    # Предупреждение HV000271 выдаёт класс настроек самого Spring Cloud Gateway 5.0,
    # к нашему коду не относится
    org.hibernate.validator.internal.metadata.aggregated.CascadingMetaDataBuilder: ERROR
