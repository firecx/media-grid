# Общие настройки для всех служб, получающих конфигурацию из центра конфигурации.
# Настройки отдельной службы кладутся в файл <имя службы>.yml рядом с этим.
# Пароли сюда не записываются: только подстановки вида ${POSTGRES_PASSWORD},
# значения которых служба берёт из своих переменных среды.

# Как быстро службы узнают об изменениях регистра. По умолчанию запущенную или остановленную службу
# остальные замечали через 30–90 с (кэш регистра 30 с + опрос раз в 30 с + кэш балансировщика 35 с),
# и всё это время шлюз слал запросы остановленной службе или не знал о запущенной. Теперь — до ~20 с.
# Упавшая без снятия с регистрации служба убирается через 30 с без отметок (было 90).
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # Сквозная трассировка (ТЗ, п. 4.1.1): номер трассы переходит от шлюза ко всем службам и через шину,
  # попадает в каждую строку журнала и в поле traceId ошибок. Пишутся все запросы — для системы такого
  # масштаба это недорого. Куда отправлять трассы, задаёт docker-compose.observability.yaml
  # (MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT); без него трассы никуда не отправляются.
  tracing:
    sampling:
      probability: 1.0
  # Не в трассы: проверки доступа Spring Security (3–5 лишних участков на каждый запрос) и задачи
  # по расписанию (раз в несколько секунд). Проверки готовности и обращения к регистру служб
  # отсекает ServiceTrafficFilter.
  observations:
    enable:
      spring.security: false
      tasks.scheduled: false
  # Метрики наружу не отправляются (стартер OpenTelemetry включает их выгрузку по умолчанию,
  # и без сборщика каждая служба раз в минуту пишет в журнал ошибку)
  otlp:
    metrics:
      export:
        enabled: false

# Журналы — JSON в стандартный вывод (формат ECS): сборщик журналов разбирает поля, номер трассы
# (traceId) и участок (spanId) — в каждой строке
logging:
  structured:
    format:
      console: ecs

# Проверка токенов доступа, выданных службой авторизации
mediagrid:
  security:
    issuer: mediagrid-auth
    # Вместо адреса — имя службы в регистре: конкретный экземпляр выбирает балансировщик
    jwk-set-uri: http://auth-service/api/auth/jwks

# Балансировщик нагрузки и шина сообщений (настройки шины читают только службы, которые с ней работают)
spring:
  cloud:
    loadbalancer:
      cache:
        # Список экземпляров служб у балансировщика обновляется раз в 10 с (по умолчанию 35) —
        # в паре с опросом регистра раз в 10 с, см. eureka выше
        ttl: 10s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:mediagrid}
    password: ${RABBITMQ_PASSWORD:}
    # Брокер подтверждает приём каждого события (EventPublisher): без подтверждения событие не считается
    # отправленным и досылается позже
    publisher-confirm-type: simple
    # Событие отправляется в ответ на запрос пользователя: если шина недоступна, ждать её недолго
    # (по умолчанию 60 с) — событие всё равно будет дослано позже
    connection-timeout: 2s
    # Номер трассы передаётся вместе с сообщением: обработка события продолжает трассу запроса
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        # Сообщение, обработка которого упала, повторяется 3 раза с паузой, затем уходит в очередь .dlq
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
        default-requeue-rejected: false
