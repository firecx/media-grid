# Общие настройки для всех служб, получающих конфигурацию из центра конфигурации.
# Настройки отдельной службы кладутся в файл <имя службы>.yml рядом с этим.
# Пароли сюда не записываются: только подстановки вида ${POSTGRES_PASSWORD},
# значения которых служба берёт из своих переменных среды.

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Проверка токенов доступа, выданных службой авторизации
mediagrid:
  security:
    issuer: mediagrid-auth
    # Вместо адреса — имя службы в регистре: конкретный экземпляр выбирает балансировщик
    jwk-set-uri: http://auth-service/api/auth/jwks

# Шина сообщений — для служб, которые с ней работают; остальные эти настройки не читают
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:mediagrid}
    password: ${RABBITMQ_PASSWORD:}
    listener:
      simple:
        # Сообщение, обработка которого упала, повторяется 3 раза с паузой, затем уходит в очередь .dlq
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
        default-requeue-rejected: false
