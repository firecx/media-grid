# Настройки службы авторизации.

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mediagrid}
    # Своя учётная запись службы (создаёт db-setup, infra/postgres/setup.sh), а не администратора базы
    username: ${DB_USER:mediagrid_auth}
    password: ${DB_PASSWORD}
    hikari:
      # Схема службы для всех запросов, в том числе написанных на чистом SQL
      schema: auth
  jpa:
    open-in-view: false
    hibernate:
      # Схему меняет только Flyway (db/migration), Hibernate лишь сверяет её с классами
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
  flyway:
    schemas: auth
    default-schema: auth
  cloud:
    loadbalancer:
      cache:
        # Служба никого не вызывает через балансировщик
        enabled: false

mediagrid:
  auth:
    # Общее значение из config/application.yml: по нему токены проверяют остальные службы
    issuer: ${mediagrid.security.issuer}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    cookie:
      name: mediagrid_refresh
      # Куки передаётся только по защищённому каналу (ТЗ, п. 4.1.5). На localhost браузеры
      # принимают такие куки и без него; на сервере без защищённого канала вход работать не будет
      secure: true
    bootstrap-admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
    # Службы, которым выдаётся токен с ролью SERVICE (POST /internal/auth/token, только внутри сети).
    # Секрет — не короче 32 символов; пустой — вход службе закрыт
    service-clients:
      processing-service: ${PROCESSING_CLIENT_SECRET:}
