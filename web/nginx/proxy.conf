# Передача запроса шлюзу; подключается в каждом location, ведущем в /api.
# Адрес шлюза — через переменную: тогда nginx заново спрашивает его у DNS docker (resolver) и не теряет
# шлюз, если тот перезапустился с другим адресом.
proxy_pass http://$gateway;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Загрузка: части файла идут в шлюз сразу, без накопления на диске nginx и без ограничения размера
client_max_body_size 0;
proxy_request_buffering off;
# Выдача: файлы и видео идут к браузеру потоком, перемотка (Range) передаётся как есть
proxy_buffering off;
proxy_read_timeout 1h;
proxy_send_timeout 1h;

# Шлюз недоступен — ответ в общем формате ошибок, а не страница nginx
proxy_intercept_errors off;
error_page 502 503 504 = @gateway_down;
