# Сборщик журналов и трасс MediaGrid (docker-compose.observability.yaml).
# Журналы: читает стандартный вывод контейнеров MediaGrid из файлов Docker. Трассы: принимает от служб
# по OTLP. Всё отправляет в OpenObserve; пароль хранилища знает только сборщик.

[SERVICE]
    Flush             2
    Log_Level         info
    Parsers_File      parsers.conf
    # Пока хранилище недоступно, данные копятся на диске сборщика, а не теряются
    storage.path      /fluent-bit/state/buffer
    storage.sync      normal
    storage.backlog.mem_limit 16M
    HTTP_Server       On
    HTTP_Listen       0.0.0.0
    HTTP_Port         2020
    Health_Check      On

# Журналы контейнеров. Место чтения запоминается (DB): после перезапуска сборщик продолжает с того же места
[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    DB                /fluent-bit/state/tail.db
    Mem_Buf_Limit     16MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    storage.type      filesystem

# Трассы служб (OpenTelemetry, OTLP по HTTP)
[INPUT]
    Name              opentelemetry
    Tag               otel
    Listen            0.0.0.0
    Port              4318

# Имя контейнера: docker-compose.yaml пишет его в attrs.tag каждой записи (logging.options.tag)
[FILTER]
    Name              nest
    Match             docker.*
    Operation         lift
    Nested_under      attrs
    Add_prefix        attrs_

[FILTER]
    Name              modify
    Match             docker.*
    Rename            attrs_tag container

# Только контейнеры MediaGrid, кроме самих хранилища и сборщика
[FILTER]
    Name              grep
    Match             docker.*
    Regex             container ^mediagrid
    Exclude           container (openobserve|fluent-bit)

# Журналы Java-служб — JSON (ECS): поля traceId, log.level, service.name становятся полями записи
[FILTER]
    Name              parser
    Match             docker.*
    Key_Name          log
    Parser            json
    Reserve_Data      On

[OUTPUT]
    Name              http
    Match             docker.*
    Host              ${OBSERVE_HOST}
    Port              5080
    URI               /api/default/mediagrid/_json
    Format            json
    Json_date_key     _timestamp
    Json_date_format  iso8601
    HTTP_User         ${OBSERVE_ADMIN_EMAIL}
    HTTP_Passwd       ${OBSERVE_ADMIN_PASSWORD}
    compress          gzip
    Retry_Limit       no_limits

[OUTPUT]
    Name              opentelemetry
    Match             otel
    Host              ${OBSERVE_HOST}
    Port              5080
    Traces_uri        /api/default/v1/traces
    Logs_uri          /api/default/v1/logs
    Metrics_uri       /api/default/v1/metrics
    HTTP_User         ${OBSERVE_ADMIN_EMAIL}
    HTTP_Passwd       ${OBSERVE_ADMIN_PASSWORD}
    Retry_Limit       no_limits
