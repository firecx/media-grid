# nginx на VDS: пересылка соединений посетителей на машину с MediaGrid через туннель WireGuard.
# Соединения не расшифровываются (TLS — только на машине с MediaGrid); первой строкой каждого
# соединения уходит заголовок PROXY protocol с адресом посетителя.
#
# Положить в /etc/nginx/mediagrid-stream.conf и подключить в конце /etc/nginx/nginx.conf, вне блока http:
#   include /etc/nginx/mediagrid-stream.conf;
# Нужен модуль stream (Debian/Ubuntu: пакет libnginx-mod-stream). Сайт по умолчанию, занимающий 80,
# отключить: rm /etc/nginx/sites-enabled/default.
# 10.8.0.2 — адрес машины с MediaGrid в туннеле (infra/vds/wg-pc.conf).

stream {
    server {
        listen 80;
        # listen [::]:80;            # если у VDS есть IPv6
        proxy_pass 10.8.0.2:8080;
        proxy_protocol on;
        proxy_connect_timeout 5s;
    }

    server {
        listen 443;
        # listen [::]:443;
        proxy_pass 10.8.0.2:8443;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        # Загрузка и просмотр больших файлов: соединение не обрывается, пока по нему идут данные,
        # а простаивающее закрывается через час (как в nginx MediaGrid)
        proxy_timeout 1h;
    }
}
