# WireGuard на VDS: /etc/wireguard/wg0.conf, запуск — systemctl enable --now wg-quick@wg0.
# Ключи: wg genkey | tee vds.key | wg pubkey > vds.pub (то же на машине с MediaGrid — в приложении
# WireGuard ключи создаются сами). Закрытые ключи никуда не копировать.
# Пересылка пакетов (ip_forward) и правила NAT не нужны: соединение в туннель открывает сам nginx на VDS.

[Interface]
Address = 10.8.0.1/24
ListenPort = 51820
PrivateKey = <закрытый ключ VDS>

[Peer]
# Машина с MediaGrid
PublicKey = <открытый ключ машины с MediaGrid>
AllowedIPs = 10.8.0.2/32
