# WireGuard на машине с MediaGrid (Windows: приложение WireGuard → «Добавить пустой туннель»,
# ключи создаются сами; открытый ключ — в wg-vds.conf на VDS).
# Через туннель идёт только связь с VDS (AllowedIPs = 10.8.0.1/32), остальной интернет — как обычно.

[Interface]
Address = 10.8.0.2/24
PrivateKey = <закрытый ключ машины с MediaGrid>

[Peer]
# VDS
PublicKey = <открытый ключ VDS>
Endpoint = <белый адрес VDS>:51820
AllowedIPs = 10.8.0.1/32
# Машина за домашним роутером: туннель поддерживается изнутри, иначе VDS не достучится
PersistentKeepalive = 25
